# Siggy + Peppy Integration Configuration
# Add this to your project's .siggy.yml file to enable Peppy integration
#
# For full documentation, see: https://github.com/user/peppy/docs/SIGGY_INTEGRATION.md

# Peppy Plugin Configuration
plugins:
  peppy:
    # Enable/disable Peppy integration
    enabled: true

    # Automatically index codebase on session start
    auto_index: true

    # Path to index (relative to project root, or absolute)
    # Default: "." (current directory)
    index_path: "."

    # Paths to exclude from indexing (glob patterns)
    exclude_patterns:
      - "node_modules/**"
      - ".git/**"
      - "dist/**"
      - "build/**"
      - "__pycache__/**"
      - "*.min.js"
      - "*.bundle.js"

    # How often to re-index (in minutes)
    # 0 = only index once per session
    # Default: 60
    reindex_interval: 60

    # Use Peppy-enhanced agents automatically when Peppy is enabled
    # This overrides the default agents with Peppy-optimized versions
    use_enhanced_agents: true

    # Custom paths to Peppy-enhanced agents (optional)
    # If not specified, uses bundled agents from Peppy installation
    # agents:
    #   planner: ".siggy/agents/peppy-planner.md"
    #   executor: ".siggy/agents/peppy-executor.md"

# Example full .siggy.yml with Peppy enabled:
#
# version: "1.10"
#
# project:
#   name: "my-project"
#   description: "My awesome project"
#
# execution:
#   mode: subagent
#   parallel: true
#   max_parallel: 3
#
# plugins:
#   peppy:
#     enabled: true
#     auto_index: true
#     use_enhanced_agents: true
#
# # These are auto-set when peppy.use_enhanced_agents is true:
# # agents:
# #   planner: <peppy-planner.md>
# #   executor: <peppy-executor.md>
